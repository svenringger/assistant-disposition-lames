<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disposition de lames</title>
<style>
  :root { --bois: #8a5a2b; --fond: #f6f3ee; --carte: #fff; --texte: #2b2620; --doux: #6f665b; --ligne: #ddd5c8; --accent: #8a5a2b; --alerte: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--texte); background: var(--fond); }
  header { padding: 14px 20px; background: var(--carte); border-bottom: 1px solid var(--ligne); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header .sous { color: var(--doux); }
  main { display: grid; grid-template-columns: 400px 1fr; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  aside, section.res { min-width: 0; }
  .carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .carte h2 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); }
  label { display: block; font-size: 12px; color: var(--doux); margin: 6px 0 2px; }
  input, select { font: inherit; padding: 4px 6px; border: 1px solid var(--ligne); border-radius: 6px; background: #fff; width: 100%; min-width: 0; }
  input[type=checkbox] { width: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { font-size: 11px; font-weight: 600; color: var(--doux); text-align: left; padding: 2px 3px; }
  td { padding: 2px 3px; vertical-align: middle; }
  td input, td select { padding: 3px 4px; }
  .grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--ligne); background: #fff; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primaire { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.petit { padding: 2px 7px; font-size: 12px; }
  .barre { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .mur-carte { border: 1px solid var(--ligne); border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #fbfaf7; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .kpi { background: #faf7f1; border: 1px solid var(--ligne); border-radius: 8px; padding: 8px 10px; }
  .kpi b { display: block; font-size: 20px; }
  .kpi span { color: var(--doux); font-size: 12px; }
  .variantes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .variante { text-align: left; border: 1px solid var(--ligne); border-radius: 8px; padding: 8px 10px; background: #fff; }
  .variante.actif { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(138,90,43,.25); }
  .variante small { color: var(--doux); display: block; }
  .erreur { background: #fdecea; border: 1px solid #f3b9b4; color: var(--alerte); padding: 8px 10px; border-radius: 8px; white-space: pre-line; }
  .avert { background: #fff6e5; border: 1px solid #ecd39c; padding: 8px 10px; border-radius: 8px; }
  .avert ul { margin: 4px 0 0 18px; padding: 0; }
  .legende { display: flex; gap: 14px; flex-wrap: wrap; margin: 4px 0 8px; font-size: 12px; color: var(--doux); }
  .puce { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.25); }
  svg { width: 100%; height: auto; background: #fff; border: 1px solid var(--ligne); border-radius: 8px; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--doux); }
  .pieces { font-variant-numeric: tabular-nums; }
  .note { color: var(--doux); font-size: 12px; }
  footer.credit { margin: 0; padding: 8px 20px 20px; text-align: center; color: var(--doux); font-size: 12px; }
  footer.credit a { color: var(--accent); text-decoration: none; }
  footer.credit a:hover { text-decoration: underline; }
  @media print { aside, .barre, header .sous, .variantes-carte { display: none !important; } main { display: block; padding: 0; } .carte { break-inside: avoid; } }
</style>
</head>
<body>
<header>
  <h1 id="titre">Disposition de lames</h1>
  <span class="sous">Les dimensions sont en millimètres. Le calcul se met à jour à chaque modification.</span>
</header>
<main>
  <aside>
    <div class="carte">
      <h2>Projet</h2>
      <label for="projet">Nom du projet</label>
      <input id="projet" type="text">
      <div class="barre">
        <button id="exporter-json" type="button">Enregistrer les paramètres</button>
        <button id="importer-json" type="button">Charger des paramètres</button>
        <input id="fichier-json" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="carte"><h2>Lames</h2><div id="zone-lames"></div></div>
    <div class="carte"><h2>Murs</h2><div id="zone-murs"></div></div>
    <div class="carte"><h2>Réglages</h2><div id="zone-options"></div></div>
  </aside>
  <section class="res">
    <div id="zone-erreur"></div>
    <div class="carte variantes-carte">
      <h2>Variantes comparées</h2>
      <div class="note" id="note-variantes">Chaque carte est une disposition possible. Cliquer pour l'afficher.</div>
      <div class="variantes" id="zone-variantes"></div>
    </div>
    <div class="carte">
      <h2>Résultat affiché</h2>
      <div id="zone-resume"></div>
    </div>
    <div id="zone-avert"></div>
    <div id="zone-murs-res"></div>
    <div class="carte">
      <h2>Lames nécessaires</h2>
      <div id="zone-commande"></div>
      <div class="barre">
        <button id="csv" type="button">Télécharger la liste (CSV)</button>
        <button id="svg" type="button">Télécharger les schémas (SVG)</button>
        <button id="imprimer" type="button">Imprimer</button>
      </div>
    </div>
  </section>
</main>
<footer class="credit">brained by <a href="https://01lab.ch">01lab.ch</a></footer>

<script type="application/json" id="entree">/*@ENTREE@*/</script>
<script>/*@MOTEUR@*/</script>
<script>
(function () {
  'use strict';
  var Cal = window.Calepinage;
  var PALETTE = ['#d9b98a', '#a9743f', '#e8d3ac', '#7d4f26', '#c48f5a', '#efe0c2'];
  var EXEMPLE = {
    projet: 'Exemple',
    lames: [
      { id: 'A', largeurUtile: 90, epaisseur: 18, longueur: 2400 },
      { id: 'B', largeurUtile: 140, epaisseur: 18, longueur: 3000 }
    ],
    murs: [{ id: 'mur-1', largeur: 3600, hauteur: 2450, obstacles: [] }],
    options: { orientation: 'auto', motif: 'auto' }
  };
  var etat;
  try { etat = JSON.parse(document.getElementById('entree').textContent); } catch (e) { etat = null; }
  if (!etat || !etat.lames) etat = JSON.parse(JSON.stringify(EXEMPLE));
  etat.options = etat.options || {};
  etat.lames = etat.lames || [];
  etat.murs = etat.murs || [];
  etat.murs.forEach(function (m) { m.obstacles = m.obstacles || []; });

  var dernier = null;
  var minuterie = null;

  function h(tag, attrs) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'texte') el.textContent = attrs[k];
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }
  function f(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }
  function planifier() { clearTimeout(minuterie); minuterie = setTimeout(calculer, 200); }

  function champ(obj, cle, opt) {
    opt = opt || {};
    var input = h('input', { type: opt.type || 'number', step: opt.step || 'any', placeholder: opt.placeholder || '' });
    var v = obj[cle];
    input.value = (v === undefined || v === null) ? '' : v;
    input.addEventListener('input', function () {
      var val = input.value;
      if (val === '') { if (opt.requis) obj[cle] = ''; else delete obj[cle]; }
      else obj[cle] = (opt.type === 'text') ? val : Number(val);
      planifier();
    });
    return input;
  }

  function dessinerLames() {
    var zone = document.getElementById('zone-lames');
    zone.innerHTML = '';
    var table = h('table', {}, h('tr', {},
      h('th', { texte: 'Id' }), h('th', { texte: 'Larg. utile' }), h('th', { texte: 'Longueur' }),
      h('th', { texte: 'Épaiss.' }), h('th', { texte: 'Quantité' }), h('th', { texte: 'Prix' }),
      h('th', { texte: 'Par paquet' }), h('th', { texte: 'Refend.' }), h('th', {})));
    etat.lames.forEach(function (l, i) {
      var refend = h('input', { type: 'checkbox' });
      refend.checked = l.refendable !== false;
      refend.addEventListener('change', function () { if (refend.checked) delete l.refendable; else l.refendable = false; planifier(); });
      table.appendChild(h('tr', {},
        h('td', {}, champ(l, 'id', { type: 'text', requis: true })),
        h('td', {}, champ(l, 'largeurUtile', { requis: true })),
        h('td', {}, champ(l, 'longueur', { requis: true })),
        h('td', {}, champ(l, 'epaisseur')),
        h('td', {}, champ(l, 'quantite', { placeholder: 'illim.' })),
        h('td', {}, champ(l, 'prix')),
        h('td', {}, champ(l, 'lamesParPaquet')),
        h('td', {}, refend),
        h('td', {}, h('button', { class: 'petit', type: 'button', texte: 'x', title: 'Supprimer', onclick: function () { etat.lames.splice(i, 1); dessinerLames(); planifier(); } }))));
    });
    zone.appendChild(table);
    zone.appendChild(h('div', { class: 'note', texte: 'Quantité vide : stock illimité (mode achat). Une quantité renseignée : stock à utiliser.' }));
    zone.appendChild(h('div', { class: 'barre' }, h('button', { type: 'button', texte: 'Ajouter une lame', onclick: function () {
      etat.lames.push({ id: 'L' + (etat.lames.length + 1), largeurUtile: 90, longueur: 2400 }); dessinerLames(); planifier(); } })));
  }

  function dessinerMurs() {
    var zone = document.getElementById('zone-murs');
    zone.innerHTML = '';
    etat.murs.forEach(function (m, i) {
      var orient = h('select', {}, h('option', { value: '', texte: 'selon le calcul' }), h('option', { value: 'horizontal', texte: 'horizontal' }), h('option', { value: 'vertical', texte: 'vertical' }));
      orient.value = m.orientation || '';
      orient.addEventListener('change', function () { if (orient.value) m.orientation = orient.value; else delete m.orientation; planifier(); });
      var obs = h('table', {}, h('tr', {}, h('th', { texte: 'Obstacle' }), h('th', { texte: 'x' }), h('th', { texte: 'y' }), h('th', { texte: 'Larg.' }), h('th', { texte: 'Haut.' }), h('th', { texte: 'Type' }), h('th', {})));
      m.obstacles.forEach(function (ob, j) {
        var type = h('select', {}, h('option', { value: '', texte: 'auto' }), h('option', { value: 'trou', texte: 'trou' }), h('option', { value: 'ouverture', texte: 'ouverture' }));
        type.value = ob.type || '';
        type.addEventListener('change', function () { if (type.value) ob.type = type.value; else delete ob.type; planifier(); });
        obs.appendChild(h('tr', {},
          h('td', {}, champ(ob, 'libelle', { type: 'text', requis: true })),
          h('td', {}, champ(ob, 'x', { requis: true })), h('td', {}, champ(ob, 'y', { requis: true })),
          h('td', {}, champ(ob, 'largeur', { requis: true })), h('td', {}, champ(ob, 'hauteur', { requis: true })),
          h('td', {}, type),
          h('td', {}, h('button', { class: 'petit', type: 'button', texte: 'x', onclick: function () { m.obstacles.splice(j, 1); dessinerMurs(); planifier(); } }))));
      });
      zone.appendChild(h('div', { class: 'mur-carte' },
        h('div', { class: 'grille2' },
          h('div', {}, h('label', { texte: 'Nom du mur' }), champ(m, 'id', { type: 'text', requis: true })),
          h('div', {}, h('label', { texte: 'Sens imposé' }), orient),
          h('div', {}, h('label', { texte: 'Largeur' }), champ(m, 'largeur', { requis: true })),
          h('div', {}, h('label', { texte: 'Hauteur' }), champ(m, 'hauteur', { requis: true }))),
        h('label', { texte: 'Obstacles (origine : coin bas gauche du mur)' }), obs,
        h('div', { class: 'barre' },
          h('button', { class: 'petit', type: 'button', texte: 'Ajouter un obstacle', onclick: function () {
            m.obstacles.push({ libelle: 'obstacle', x: 0, y: 0, largeur: 100, hauteur: 100 }); dessinerMurs(); planifier(); } }),
          h('button', { class: 'petit', type: 'button', texte: 'Supprimer ce mur', onclick: function () { etat.murs.splice(i, 1); dessinerMurs(); planifier(); } }))));
    });
    zone.appendChild(h('div', { class: 'barre' }, h('button', { type: 'button', texte: 'Ajouter un mur', onclick: function () {
      etat.murs.push({ id: 'mur-' + (etat.murs.length + 1), largeur: 3000, hauteur: 2500, obstacles: [] }); dessinerMurs(); planifier(); } })));
  }

  function selectOptions(cle, valeurs, apres) {
    var s = h('select', {});
    valeurs.forEach(function (v) { s.appendChild(h('option', { value: v[0], texte: v[1] })); });
    s.value = etat.options[cle] === undefined || etat.options[cle] === null ? valeurs[0][0] : etat.options[cle];
    s.addEventListener('change', function () { etat.options[cle] = s.value; if (apres) apres(); planifier(); });
    return s;
  }

  function dessinerOptions() {
    var zone = document.getElementById('zone-options');
    zone.innerHTML = '';
    var o = etat.options;
    var motif = selectOptions('motif', [['auto', 'Meilleur choix automatique'], ['uniforme', 'Une seule largeur'], ['sequence', 'Rythme de largeurs'], ['aleatoire', 'Mélange aléatoire']], dessinerOptions);
    var extra = h('div', {});
    if (o.motif === 'uniforme') {
      var fam = h('select', {}, h('option', { value: '', texte: 'toutes, au choix du calcul' }));
      var vus = {};
      etat.lames.forEach(function (l) {
        var cle = l.famille || (l.largeurUtile + 'x' + (l.epaisseur === undefined ? '' : l.epaisseur));
        if (!vus[cle]) { vus[cle] = true; fam.appendChild(h('option', { value: cle, texte: 'largeur ' + l.largeurUtile })); }
      });
      fam.value = o.famille || '';
      fam.addEventListener('change', function () { if (fam.value) o.famille = fam.value; else delete o.famille; planifier(); });
      extra.appendChild(h('label', { texte: 'Largeur' })); extra.appendChild(fam);
    }
    if (o.motif === 'sequence') {
      var seq = h('input', { type: 'text', placeholder: 'ex. 90, 140, 90' });
      seq.value = Array.isArray(o.sequence) ? o.sequence.join(', ') : '';
      seq.addEventListener('input', function () { o.sequence = seq.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); planifier(); });
      extra.appendChild(h('label', { texte: 'Largeurs utiles dans l\'ordre, répétées jusqu\'en haut du mur' })); extra.appendChild(seq);
    }
    if (o.motif === 'aleatoire') { extra.appendChild(h('label', { texte: 'Graine (change le tirage)' })); extra.appendChild(champ(o, 'graine')); }
    zone.appendChild(h('label', { texte: 'Sens de pose' }));
    zone.appendChild(selectOptions('orientation', [['auto', 'Meilleur choix automatique'], ['horizontal', 'Horizontal'], ['vertical', 'Vertical']]));
    zone.appendChild(h('label', { texte: 'Motif des largeurs' }));
    zone.appendChild(motif);
    zone.appendChild(extra);
    var g = h('div', { class: 'grille2' });
    [['decalageMin', 'Décalage min. des joints', 300], ['longueurMinPiece', 'Longueur min. d\'une pièce', 400],
     ['largeurMinBord', 'Largeur min. d\'un rang de bord', 30], ['jeuEntreLames', 'Joint entre rangs', 0],
     ['margeBord', 'Marge au bord du mur', 0], ['margeCommandePct', 'Marge de commande (%)', 10],
     ['tailleTrouMax', 'Taille max. d\'un trou (prise)', 250]].forEach(function (d) {
      var input = champ(o, d[0], { placeholder: String(d[2]) });
      g.appendChild(h('div', {}, h('label', { texte: d[1] }), input));
    });
    zone.appendChild(g);
    zone.appendChild(h('label', { texte: 'Ordre de pose des murs (réutilisation des chutes)' }));
    zone.appendChild(selectOptions('ordreMurs', [['auto', 'Ordre le plus économe'], ['donne', 'Ordre de la liste']]));
    zone.appendChild(h('div', { class: 'note', texte: 'Ces réglages sont des valeurs de départ à ajuster. Champ vide : valeur par défaut du calcul.' }));
  }

  function couleur(cle, res) {
    var cles = [];
    res.commande.forEach(function (c) { if (cles.indexOf(c.famille) < 0) cles.push(c.famille); });
    return PALETTE[Math.max(0, cles.indexOf(cle)) % PALETTE.length];
  }

  function svgMur(m, res) {
    var NS = 'http://www.w3.org/2000/svg';
    var marge = Math.max(m.largeur, m.hauteur) * 0.09;
    var fs = Math.max(m.largeur, m.hauteur) / 62;
    var W = m.largeur, H = m.hauteur;
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', [-marge, -marge, W + 2 * marge, H + 2 * marge].join(' '));
    svg.setAttribute('xmlns', NS);
    function el(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { if (k === 'texte') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); });
      (parent || svg).appendChild(e);
      return e;
    }
    var defs = el('defs', {});
    var pat = el('pattern', { id: 'hach-' + m.id.replace(/\W/g, '_'), width: fs * 0.7, height: fs * 0.7, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
    el('line', { x1: 0, y1: 0, x2: 0, y2: fs * 0.7, stroke: 'rgba(60,40,20,.55)', 'stroke-width': fs * 0.12 }, pat);
    var idPat = 'hach-' + m.id.replace(/\W/g, '_');
    el('rect', { x: 0, y: 0, width: W, height: H, fill: '#f0ebe2' });
    m.pieces.forEach(function (p) {
      var y = H - (p.y + p.h);
      var g = el('g', {});
      var tip = 'Rang ' + p.rang + ', pièce ' + p.index + ' : ' + f(p.longueur) + ' x ' + f(p.largeurRang) + ' mm'
        + (p.origine === 'chute' ? ', issue d\'une chute' : ', lame neuve ' + p.typeId + ' (' + f(p.longueurLame) + ' mm)')
        + (p.coupe ? ', coupée en bout' : '') + (p.refendu ? ', refendue' : '') + (p.raccord ? ', raccord' : '')
        + (p.manquante ? ', HORS STOCK' : '') + (p.percements.length ? ', à percer : ' + p.percements.join(', ') : '');
      el('title', { texte: tip }, g);
      el('rect', { x: p.x, y: y, width: p.w, height: p.h, fill: couleur(p.famille, res), stroke: p.manquante ? '#b3261e' : '#fff', 'stroke-width': fs * 0.12 }, g);
      if (p.origine === 'chute') el('rect', { x: p.x, y: y, width: p.w, height: p.h, fill: 'url(#' + idPat + ')', stroke: 'none' }, g);
      var horiz = m.orientation === 'horizontal';
      var longueurPx = horiz ? p.w : p.h, epaisseurPx = horiz ? p.h : p.w;
      if (longueurPx > fs * 4.6 && epaisseurPx > fs * 0.9) {
        var cx = p.x + p.w / 2, cy = y + p.h / 2;
        var t = el('text', { x: cx, y: cy + fs * 0.33, 'text-anchor': 'middle', 'font-size': fs * 0.78, fill: '#2b2620', 'font-family': 'Helvetica, Arial, sans-serif', texte: f(p.longueur) }, g);
        if (!horiz) t.setAttribute('transform', 'rotate(-90 ' + cx + ' ' + cy + ')');
      }
    });
    m.obstacles.forEach(function (ob) {
      var y = H - (ob.y + ob.hauteur);
      var ouv = ob.type === 'ouverture';
      el('rect', { x: ob.x, y: y, width: ob.largeur, height: ob.hauteur, fill: ouv ? 'rgba(120,150,180,.35)' : 'rgba(179,38,30,.25)', stroke: ouv ? '#456' : '#b3261e', 'stroke-width': fs * 0.18, 'stroke-dasharray': (fs * 0.6) + ' ' + (fs * 0.4) });
      if (ouv) el('text', { x: ob.x + ob.largeur / 2, y: y + ob.hauteur / 2, 'text-anchor': 'middle', 'font-size': fs * 0.9, fill: '#234', 'font-family': 'Helvetica, Arial, sans-serif', texte: ob.libelle });
    });
    el('rect', { x: 0, y: 0, width: W, height: H, fill: 'none', stroke: '#2b2620', 'stroke-width': fs * 0.2 });
    var rangs = {};
    m.pieces.forEach(function (p) { if (!p.raccord && !rangs[p.rang]) rangs[p.rang] = p; });
    var horizontal = m.orientation === 'horizontal';
    Object.keys(rangs).forEach(function (k) {
      var p = rangs[k];
      if (horizontal) {
        el('text', { x: W + fs * 0.5, y: H - (p.y + p.h / 2) + fs * 0.3, 'font-size': fs * 0.7, fill: '#6f665b', 'font-family': 'Helvetica, Arial, sans-serif', texte: f(p.largeurRang) });
      } else {
        el('text', { x: p.x + p.w / 2, y: -fs * 0.6, 'font-size': fs * 0.6, 'text-anchor': 'middle', fill: '#6f665b', 'font-family': 'Helvetica, Arial, sans-serif', texte: f(p.largeurRang) });
      }
    });
    var yc = H + fs * 1.8;
    el('line', { x1: 0, y1: yc, x2: W, y2: yc, stroke: '#2b2620', 'stroke-width': fs * 0.12 });
    el('line', { x1: 0, y1: yc - fs * 0.5, x2: 0, y2: yc + fs * 0.5, stroke: '#2b2620', 'stroke-width': fs * 0.12 });
    el('line', { x1: W, y1: yc - fs * 0.5, x2: W, y2: yc + fs * 0.5, stroke: '#2b2620', 'stroke-width': fs * 0.12 });
    el('text', { x: W / 2, y: yc + fs * 1.5, 'text-anchor': 'middle', 'font-size': fs, fill: '#2b2620', 'font-family': 'Helvetica, Arial, sans-serif', texte: f(W) + ' mm' });
    var xc = -fs * 1.8;
    el('line', { x1: xc, y1: 0, x2: xc, y2: H, stroke: '#2b2620', 'stroke-width': fs * 0.12 });
    el('line', { x1: xc - fs * 0.5, y1: 0, x2: xc + fs * 0.5, y2: 0, stroke: '#2b2620', 'stroke-width': fs * 0.12 });
    el('line', { x1: xc - fs * 0.5, y1: H, x2: xc + fs * 0.5, y2: H, stroke: '#2b2620', 'stroke-width': fs * 0.12 });
    var th = el('text', { x: xc - fs * 0.6, y: H / 2, 'text-anchor': 'middle', 'font-size': fs, fill: '#2b2620', 'font-family': 'Helvetica, Arial, sans-serif', texte: f(H) + ' mm' });
    th.setAttribute('transform', 'rotate(-90 ' + (xc - fs * 0.6) + ' ' + (H / 2) + ')');
    return svg;
  }

  function tableauRangs(m) {
    var parRang = {};
    m.pieces.forEach(function (p) { (parRang[p.rang] = parRang[p.rang] || []).push(p); });
    var t = h('table', { class: 'pieces' }, h('tr', {}, h('th', { texte: 'Rang' }), h('th', { texte: 'Largeur' }), h('th', { texte: 'Pièces (longueur en mm, dans l\'ordre de pose)' })));
    Object.keys(parRang).forEach(function (k) {
      var L = parRang[k].slice().sort(function (a, b) { return (a.raccord ? 1 : 0) - (b.raccord ? 1 : 0) || (m.orientation === 'horizontal' ? a.x - b.x : a.y - b.y); });
      var txt = L.map(function (p) {
        return f(p.longueur) + (p.origine === 'chute' ? ' (chute)' : '') + (p.raccord ? ' (raccord ' + f(p.largeurRang) + ')' : '') + (p.percements.length ? ' (percer : ' + p.percements.join(', ') + ')' : '');
      }).join('  |  ');
      var r0 = parRang[k].filter(function (p) { return !p.raccord; })[0] || parRang[k][0];
      t.appendChild(h('tr', {}, h('td', { texte: k }), h('td', { texte: f(r0.largeurRang) + (r0.refendu ? ' (refendu)' : '') }), h('td', { texte: txt })));
    });
    return t;
  }

  function afficher(res, variantes) {
    var t = res.total;
    var resume = document.getElementById('zone-resume');
    resume.innerHTML = '';
    resume.appendChild(h('div', { class: 'note', texte: 'Sens ' + res.parametres.orientation + ', ' + res.parametres.libelleMotif + (res.murs.length > 1 ? '. Ordre de pose : ' + res.parametres.ordreMurs.join(', ') : '') + '.' }));
    var kp = h('div', { class: 'kpis' });
    [[t.lamesNeuves, 'lames à découper'], [f(t.chutePct) + ' %', 'chute globale'], [t.pieces, 'pièces posées'], [t.joints, 'joints bout à bout'], [t.coupes, 'coupes en bout'], [t.piecesEnChute, 'pièces issues de chutes']].forEach(function (k) {
      kp.appendChild(h('div', { class: 'kpi' }, h('b', { texte: String(k[0]) }), h('span', { texte: k[1] })));
    });
    resume.appendChild(kp);

    var av = document.getElementById('zone-avert');
    av.innerHTML = '';
    if (res.avertissements.length) {
      var ul = h('ul', {});
      res.avertissements.forEach(function (a) { ul.appendChild(h('li', { texte: a })); });
      av.appendChild(h('div', { class: 'avert carte' }, h('b', { texte: 'Points d\'attention' }), ul));
    }

    var zm = document.getElementById('zone-murs-res');
    zm.innerHTML = '';
    var leg = h('div', { class: 'legende' });
    res.commande.filter(function (c) { return c.necessaires; }).forEach(function (c) {
      leg.appendChild(h('span', {}, h('span', { class: 'puce', style: 'background:' + couleur(c.famille, res) }), c.libelle));
    });
    leg.appendChild(h('span', {}, h('span', { class: 'puce', style: 'background: repeating-linear-gradient(45deg,#d9b98a,#d9b98a 3px,#8a5a2b 3px,#8a5a2b 4px)' }), 'pièce issue d\'une chute'));
    res.murs.forEach(function (m, i) {
      var carte = h('div', { class: 'carte' }, h('h2', { texte: 'Mur ' + m.id + ' : ' + f(m.largeur) + ' x ' + f(m.hauteur) + ' mm, lames ' + (m.orientation === 'horizontal' ? 'horizontales' : 'verticales') }));
      if (i === 0) carte.appendChild(leg);
      carte.appendChild(svgMur(m, res));
      carte.appendChild(h('div', { class: 'note', texte: 'Chaque pièce indique sa longueur en mm. La largeur de chaque rang est notée à côté du mur. Survoler une pièce donne le détail.' }));
      var det = h('details', {}, h('summary', { texte: 'Détail des rangs et des pièces (à donner au monteur)' }), tableauRangs(m));
      carte.appendChild(det);
      zm.appendChild(carte);
    });

    var zc = document.getElementById('zone-commande');
    zc.innerHTML = '';
    var tab = h('table', {}, h('tr', {}, h('th', { texte: 'Lame' }), h('th', { texte: 'Nécessaires' }), h('th', { texte: 'À commander (avec marge)' }), h('th', { texte: 'Stock' }), h('th', { texte: 'Montant' })));
    res.commande.filter(function (c) { return c.necessaires || c.stock !== null; }).forEach(function (c) {
      tab.appendChild(h('tr', {}, h('td', { texte: c.libelle + ' [' + c.id + ']' }), h('td', { texte: String(c.necessaires) }),
        h('td', { texte: c.stock === null ? c.aCommander + (c.paquets !== null ? ' (' + c.paquets + ' paquets)' : '') : '-' }),
        h('td', { texte: c.stock === null ? '-' : c.stock + ' (reste ' + c.restantApres + (c.manque ? ', manque ' + c.manque : '') + ')' }),
        h('td', { texte: c.montant === null ? '-' : f(c.montant) + ' CHF' })));
    });
    zc.appendChild(tab);
    zc.appendChild(h('p', { class: 'note', texte: 'Chute globale ' + f(t.chutePct) + ' % : ' + f(t.surfaceAchetee) + ' m2 achetés pour ' + f(t.surfaceRevetue) + ' m2 posés. '
      + (res.chutesRestantes.length ? 'Chutes réutilisables restantes : ' + res.chutesRestantes.length + ' (longueurs en mm : ' + res.chutesRestantes.map(function (c) { return c.longueur + ' x ' + c.largeurRang; }).join(', ') + ').' : 'Aucune chute réutilisable restante.') }));
  }

  function dessinerVariantes(liste, actuel) {
    var zone = document.getElementById('zone-variantes');
    zone.innerHTML = '';
    liste.forEach(function (v) {
      var o = v.options;
      var actif = actuel && actuel.parametres.orientation === v.orientation && actuel.parametres.libelleMotif === v.libelle;
      var b = h('button', { type: 'button', class: 'variante' + (actif ? ' actif' : ''), onclick: function () {
        etat.options.orientation = o.orientation; etat.options.motif = o.motif;
        delete etat.options.famille; delete etat.options.sequence;
        if (o.famille !== undefined) etat.options.famille = o.famille;
        if (o.sequence) etat.options.sequence = o.sequence.slice();
        if (o.graine !== undefined) etat.options.graine = o.graine;
        dessinerOptions(); calculer(false);
      } },
        h('b', { texte: v.rang + '. Sens ' + v.orientation }),
        h('small', { texte: v.libelle }),
        h('small', { texte: v.total.lamesNeuves + ' lames, chute ' + f(v.total.chutePct) + ' %' }),
        h('small', { texte: v.total.joints + ' joints, ' + v.total.coupes + ' coupes' + (v.total.lamesManquantes ? ', MANQUE ' + v.total.lamesManquantes : '') }));
      zone.appendChild(b);
    });
  }

  function calculer(rafraichirVariantes) {
    var zoneErr = document.getElementById('zone-erreur');
    zoneErr.innerHTML = '';
    if (!Cal) { zoneErr.appendChild(h('div', { class: 'erreur', texte: 'Le moteur de calcul est absent. Régénérer cette page avec la commande « page ».' })); return; }
    try {
      dernier = Cal.calculer(etat);
      afficher(dernier);
      var libre = JSON.parse(JSON.stringify(etat));
      libre.options.orientation = 'auto'; libre.options.motif = 'auto';
      delete libre.options.famille; delete libre.options.sequence;
      dessinerVariantes(Cal.proposerVariantes(libre, { max: 6 }), dernier);
    } catch (e) {
      dernier = null;
      zoneErr.appendChild(h('div', { class: 'erreur carte', texte: e.message }));
    }
  }

  function telecharger(nom, contenu, type) {
    var blob = new Blob([contenu], { type: type });
    var a = h('a', { href: URL.createObjectURL(blob), download: nom });
    document.body.appendChild(a); a.click(); a.remove();
  }
  function slug() { return (etat.projet || 'disposition').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'disposition'; }

  document.getElementById('projet').value = etat.projet || '';
  document.getElementById('projet').addEventListener('input', function (e) { etat.projet = e.target.value; document.getElementById('titre').textContent = 'Disposition de lames' + (etat.projet ? ' : ' + etat.projet : ''); });
  document.getElementById('titre').textContent = 'Disposition de lames' + (etat.projet ? ' : ' + etat.projet : '');
  document.getElementById('exporter-json').addEventListener('click', function () { telecharger(slug() + '-parametres.json', JSON.stringify(etat, null, 2), 'application/json'); });
  document.getElementById('importer-json').addEventListener('click', function () { document.getElementById('fichier-json').click(); });
  document.getElementById('fichier-json').addEventListener('change', function (e) {
    var fichier = e.target.files[0];
    if (!fichier) return;
    var lecteur = new FileReader();
    lecteur.onload = function () {
      try {
        var lu = JSON.parse(lecteur.result);
        if (!lu.lames || !lu.murs) throw new Error('Ce fichier ne contient pas de lames ni de murs.');
        etat = lu; etat.options = etat.options || {};
        etat.murs.forEach(function (m) { m.obstacles = m.obstacles || []; });
        document.getElementById('projet').value = etat.projet || '';
        dessinerLames(); dessinerMurs(); dessinerOptions(); calculer();
      } catch (err) {
        var z = document.getElementById('zone-erreur'); z.innerHTML = '';
        z.appendChild(h('div', { class: 'erreur carte', texte: 'Fichier non chargé : ' + err.message }));
      }
    };
    lecteur.readAsText(fichier);
  });
  document.getElementById('csv').addEventListener('click', function () { if (dernier) telecharger(slug() + '-liste-lames.csv', Cal.csvCommande(dernier), 'text/csv'); });
  document.getElementById('svg').addEventListener('click', function () {
    if (!dernier) return;
    dernier.murs.forEach(function (m) {
      var s = new XMLSerializer().serializeToString(svgMur(m, dernier));
      telecharger(slug() + '-' + m.id + '.svg', '<?xml version="1.0" encoding="UTF-8"?>\n' + s, 'image/svg+xml');
    });
  });
  document.getElementById('imprimer').addEventListener('click', function () { window.print(); });

  dessinerLames(); dessinerMurs(); dessinerOptions(); calculer();
})();
</script>
